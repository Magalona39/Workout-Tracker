<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Workout Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap");
  </style>
  <body>
    <h1>🏋️ WORKOUT TRACKER</h1>

    <button id="startButton">Let's Start</button>

    <p id="message"></p>

    <input type="text" id="exerciseInput" placeholder="input exercise" />

    <div class="setReps">
      <p>SETS</p>
      <input type="number" id="sets" />

      <p>REPS</p>
      <input type="number" id="reps" /><br />                                                                               
    </div>
    <button id="addButton">Add Exercise</button>

    <ul id="exerciseMessage"></ul>

    <script src="script.js"></script>
  </body>
</html>
